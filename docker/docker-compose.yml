services:
  monkeytype-frontend:
    container_name: monkeytype-frontend

    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile

    image: monkeytype-frontend-local:latest

    ports:
      - "8089:80"

    restart: unless-stopped

    depends_on:
      monkeytype-backend:
        condition: service_healthy
        restart: true

    env_file:
      - path: /tank/secrets/monkeytype.env
        required: true

    environment:
      - MONKEYTYPE_BACKENDURL=/api
    networks:
      - default
      - proxy

  monkeytype-backend:
    container_name: monkeytype-backend

    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    image: monkeytype-backend-local:latest

    ports:
      - "5005:5005"

    restart: unless-stopped

    env_file:
      - path: /tank/secrets/monkeytype.env
        required: true

    environment:
      - DB_NAME=monkeytype
      - DB_URI=mongodb://monkeytype-mongodb:27017
      - REDIS_URI=redis://monkeytype-redis:6379
      - WAIT_FOR_HOSTS=monkeytype-mongodb:27017 monkeytype-redis:6379
      - RATE_LIMIT_MULTIPLIER=100000
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_TRANSLATION_MODEL=translategemma:4b
      - OLLAMA_CODE_MODEL=qwen2.5:7b-instruct-q6_K

    networks:
      - default

    volumes:
      - type: bind
        source: ./backend-configuration.json
        target: /app/backend/dist/backend-configuration.json
        read_only: true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      monkeytype-redis:
        condition: service_healthy
        restart: true
      monkeytype-mongodb:
        condition: service_healthy
        restart: true

    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "5005"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  mistyped-word-stats-migration:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: builder

    profiles: [migration]

    environment:
      - DB_NAME=monkeytype
      - DB_URI=mongodb://monkeytype-mongodb:27017

    networks:
      - default

    depends_on:
      monkeytype-mongodb:
        condition: service_healthy

    command:
      [
        "pnpm",
        "--filter",
        "@monkeytype/backend",
        "exec",
        "tsx",
        "__migration__/normalizeMistypedWordStats.ts",
      ]

  monkeytype-redis:
    container_name: monkeytype-redis
    image: redis:6.2.6
    #uncomment if you want to expose the redis server
    #ports:
    #  - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - ../.volumes/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s
    networks:
      - default

  monkeytype-mongodb:
    container_name: monkeytype-mongodb
    image: mongo:5.0.13
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    #uncomment if you want to expose the mongodb server
    #ports:
    #  - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.stats().ok' | mongo localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s
    networks:
      - default

volumes:
  mongo-data:
    external: true
    name: monkeytype_mongo_data

networks:
  proxy:
    external: true
    name: slave_default
